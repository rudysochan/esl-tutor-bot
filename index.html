<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Tutor Bot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<!-- ESL Tutor Bot — unified quiz/conversation build -->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f8f6;
    --surface: #ffffff;
    --surface2: #f2f0ec;
    --border: #e2dfd8;
    --border2: #ccc9c0;
    --text: #1a1a18;
    --text2: #6b6860;
    --text3: #9e9b93;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-border: #bfdbfe;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    width: 100%;
    max-width: 1400px;
    margin-bottom: 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header span {
    font-size: 13px;
    color: var(--text3);
    font-family: 'Courier New', monospace;
  }

  #main {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Setup panel */
  #setup-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  #setup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  #setup-header.open { border-bottom-color: var(--border); }

  #setup-title {
    font-size: 13px;
    font-weight: normal;
    font-family: 'Courier New', monospace;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #setup-indicator {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border2);
    transition: background 0.2s;
  }

  #setup-indicator.loaded { background: var(--success); }

  #chevron {
    font-size: 11px;
    color: var(--text3);
    transition: transform 0.2s;
  }

  #chevron.rotated { transform: rotate(180deg); }

  #setup-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #setup-body.hidden { display: none; }

  label {
    font-size: 12px;
    color: var(--text3);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    font-family: Georgia, serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    resize: vertical;
  }

  textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  textarea::placeholder { color: var(--text3); }

  #lesson-input { height: 120px; }
  #user-input { height: 48px; flex: 1; resize: none; }

  button {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
  }

  #start-btn {
    padding: 10px 18px;
    background: var(--text);
    color: var(--bg);
    border: none;
    align-self: flex-start;
  }

  #start-btn:hover { opacity: 0.85; }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #error-bar {
    font-size: 13px;
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid #fecaca;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: none;
    line-height: 1.5;
    font-family: 'Courier New', monospace;
    word-break: break-all;
  }

  /* Chat area */
  #chat-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 380px;
    max-height: calc(100vh - 300px);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    font-size: 14px;
    gap: 8px;
    text-align: center;
    padding: 40px;
  }

  #empty-state .icon { font-size: 28px; opacity: 0.4; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 95%; }
  .msg.tutor { align-self: flex-start; max-width: 100%; }
  .msg.student { align-self: flex-end; }

  .msg-label {
    font-size: 11px;
    color: var(--text3);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.04em;
  }

  .msg.student .msg-label { text-align: right; }

  .bubble {
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    border-radius: 4px 14px 14px 14px;
  }

  .msg.tutor .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .msg.student .bubble {
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    border-radius: 14px 4px 14px 14px;
  }

  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 16px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
    animation: bounce 1.2s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input row */
  #input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #send-btn {
    height: 48px;
    width: 48px;
    background: var(--text);
    color: var(--bg);
    border: none;
    flex-shrink: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    font-size: 12px;
    color: var(--text3);
    font-family: 'Courier New', monospace;
    text-align: right;
  }

  /* --- session parameters --- */
  #param-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .param-field { display: flex; flex-direction: column; gap: 6px; }
  #param-grid select, #lesson-number-input {
    width: 100%; font-family: 'Courier New', monospace; font-size: 13px;
    color: var(--text); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px;
  }
  #param-grid select { cursor: pointer; }
  #param-grid select:focus, #lesson-number-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .param-note { font-size: 10px; color: var(--text3); font-style: italic; text-transform: none; letter-spacing: 0; }
  #lesson-number-input:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Quiz / Conversation switch — a sliding knob with a label on each side */
  #mode-toggle {
    display: inline-flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .mode-label {
    font-family: 'Courier New', monospace; font-size: 13px; color: var(--text3);
    cursor: pointer; user-select: none; transition: color 0.2s;
  }
  .mode-label.active { color: var(--text); font-weight: 500; }
  #mode-switch {
    position: relative; width: 58px; height: 30px; flex: none; padding: 0;
    background: var(--accent); border: none; border-radius: 15px; cursor: pointer;
    transition: background 0.2s;
  }
  #mode-switch.conversation { background: #7c5cff; }
  #mode-knob {
    position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  #mode-switch.conversation #mode-knob { transform: translateX(28px); }
  #mode-toggle.locked { opacity: 0.5; }
  #mode-toggle.locked .mode-label, #mode-toggle.locked #mode-switch { cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>ESL Tutor Bot</h1>
  <span>prototype v1</span>
</header>

<div id="main">

  <div id="setup-panel">
    <div id="setup-header" class="open" onclick="toggleSetup()">
      <div id="setup-title">
        <span id="setup-indicator"></span>
        lesson material
      </div>
      <span id="chevron" class="rotated">▲</span>
    </div>
    <div id="setup-body">
    <div id="mode-toggle" role="group" aria-label="session mode">
        <span id="mode-label-quiz" class="mode-label active" onclick="switchMode('quiz')">Quiz</span>
        <button type="button" id="mode-switch" role="switch" aria-checked="false" aria-label="Toggle between Quiz and Conversation mode" onclick="toggleMode()"><span id="mode-knob"></span></button>
        <span id="mode-label-conv" class="mode-label" onclick="switchMode('conversation')">Conversation</span>
      </div>

      <div id="setup-fields">
        <div id="param-grid">
          <div class="param-field">
            <label for="difficulty-select">difficulty</label>
            <select id="difficulty-select">
              <option value="Beginner">Beginner</option>
              <option value="Intermediate" selected>Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>
          <div class="param-field" id="questions-field">
            <label for="question-count-select">questions</label>
            <select id="question-count-select">
              <option value="8" selected>8</option>
              <option value="12">12</option>
              <option value="18">18</option>
            </select>
          </div>
          <div class="param-field">
            <label for="native-lang-select">native language</label>
            <select id="native-lang-select">
              <option value="Not specified" selected>Not specified</option>
              <option value="Spanish">Spanish</option>
              <option value="Mandarin Chinese">Mandarin Chinese</option>
              <option value="Korean">Korean</option>
              <option value="Japanese">Japanese</option>
              <option value="Vietnamese">Vietnamese</option>
              <option value="Arabic">Arabic</option>
              <option value="Portuguese">Portuguese</option>
              <option value="French">French</option>
              <option value="Russian">Russian</option>
              <option value="Tagalog">Tagalog</option>
              <option value="Ukranian">Ukranian</option>
            </select>
          </div>
          <div class="param-field">
            <label for="lesson-select">lesson</label>
            <select id="lesson-select" onchange="handleLessonSelect(this.value)">
              <option value="" selected>Choose a lesson</option>
              <option value="16">Lesson 16 (DEMO)</option>
            </select>
          </div>
        </div>
        <div class="param-field" style="margin-bottom:8px;">
          <label for="lesson-file-input">or upload a file (.docx / .pdf)</label>
          <input type="file" id="lesson-file-input" accept=".docx,.pdf" onchange="handleFileUpload(event)">
          <!-- accept=".docx,.pdf" limits the file picker to these two types; onchange fires handleFileUpload whenever a file is selected -->
          <span id="upload-status" style="font-size:0.85em; color:var(--text3);"></span>
          <!-- empty span that will hold status text like "extracting..." or an error, filled in by JS -->
        </div>
        <label for="lesson-input">paste lesson content below</label>
        <textarea id="lesson-input" placeholder="Vocabulary list, grammar rules, a reading passage, chapter notes — anything you want the bot to quiz the student on."></textarea>

        <label for="instructions-input" style="margin-top:8px;">teacher instructions <span class="param-note">optional</span></label>
        <textarea id="instructions-input" placeholder="This field is for teachers to provide the bot with instructions separate from the lesson material. In quiz mode, it might be to focus on specific topic areas or use specific question types." style="height:80px;"></textarea>
      </div>

      <button id="start-btn" onclick="startSession()">load &amp; start quiz →</button>
      <div id="error-bar"></div>
    </div>
  </div>

  <div id="chat-area">
    <div id="empty-state">
      <div class="icon">✦</div>
      <div>paste lesson material above, then start a session</div>
    </div>
  </div>

  <div id="input-row">
    <textarea id="user-input" placeholder="Type your answer and press Enter..." disabled onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>→</button>
  </div>
  <div class="hint">shift+enter for new line · enter to send</div>

</div>

<script>
// ---- Session state (shared by both modes) ----
let lessonMaterial = '';        // lesson text, typed or extracted from a file
let teacherInstructions = '';   // optional teacher directives; kept separate so a file upload can't overwrite it
let conversationHistory = [];    // full turn-by-turn record sent to the API; persists across mode switches
let sessionActive = false;
let isTyping = false;            // true while awaiting a bot reply; also locks the mode toggle
let setupOpen = true;
let pendingFile = null;          // a chosen-but-not-yet-extracted file; extraction runs at start

// ---- Mode + quiz parameters ----
let sessionMode = 'quiz';        // 'quiz' | 'conversation' — the orientation the bot runs each turn
let difficulty = 'Intermediate';
let questionCount = '8';
let nativeLanguage = 'Not specified';
let lessonNumber = '';           // placeholder — captured but not yet wired to anything

// ---- Mid-session switching ----
// One bot, two orientations. The toggle can be flipped mid-session: buildSystemPrompt() rebuilds
// every turn and history carries across modes. To keep the transcript clean when a student toggles
// without engaging, an unanswered switch turn is "provisional" — returning to the committed mode
// removes it, and a cached turn is restored instead of being regenerated.
let committedMode = 'quiz';      // the mode the student last actually engaged with (the "origin")
let pendingSwitch = false;       // is the latest turn an unanswered mode switch?
let provisionalNode = null;      // DOM node of the provisional switch message, so we can remove it precisely
let switchCache = { quiz: null, conversation: null }; // cached switch turns, valid until the student engages

// ---- Preloaded demo lesson ----
// Embedded directly (not fetched) so selecting it is instant with zero network dependency — no
// cold-start lag, no failed fetch, nothing that can hiccup mid-demo. Pre-extracted + cleaned the
// same way the /api/extract-text pipeline cleans an uploaded PDF (strips headers/page numbers,
// fixes extraction spacing artifacts, keeps vocab + grammar rules/examples intact).
const DEMO_LESSONS = {
  '16': `Vocabulary
apple, banana, grape, orange, pineapple, strawberry, watermelon, coconut, lemon, cherry, lettuce, broccoli, onion, tomato, pepper, cucumber, corn, carrot, mushroom, potato, fruit, vegetable, juicy, sweet, sour, to offer, to prepare, to give, to eat

Grammar: some and any (indefinite quantifiers)
Some and any describe an amount or number of something when the exact amount is unknown. Use "some" in affirmative (positive) statements. Use "any" in negative statements.
- I have some lettuce. / I don't have any mushrooms.
- Rosa always gives me some apples. / She doesn't give me any oranges.
- Robert wants some sweet corn. / He doesn't want any tomatoes.
- The boys need some fruit. / They don't need any vegetables.

Questions with some and any
Both words can be used in questions. Use "some" when offering something, or when we expect the answer to be yes (e.g. "Do you want some?"). Use "any" when asking if something is there or available (e.g. "Do you have any?").
- Do you want some watermelon? Yes, I want some watermelon. / No, I don't want any watermelon.
- Does Jose eat peppers? Yes, he eats some peppers. / No, he doesn't eat any peppers.
- Do they use onions in the soup? Yes, they use some onions. / No, they don't use any onions.
- Are you looking for some cherries? Yes, I'm looking for some cherries. / No, I'm not looking for any cherries.
- Do you have any carrots? Yes, I have some carrots. / No, I don't have any carrots.
- Does he eat any vegetables? Yes, he eats peppers and cucumbers. / No, he doesn't eat any.

Grammar: there is and there are
Used with "to be" to say something exists or is present in a place or situation. Singular: there is. Plural: there are. Negative forms: "there is no" / "there isn't any" (singular); "there are no" / "there aren't any" (plural). Questions put "to be" before "there": "Is there...?" / "Are there...?"
- There is lettuce. / There is no lettuce.
- There is some broccoli. / There is not any broccoli.
- There are sweet onions. / There are no red onions.
- There are some green grapes. / There are not any purple grapes.
- Is there corn for Tom? Yes, there is some corn for Tom. / No, there isn't any corn for Tom.
- Are there any juicy oranges? Yes, there are some juicy oranges. / No, there aren't any juicy oranges.
- Is there any lemon in the refrigerator? Yes, there is some lemon in there. / No, there is no lemon in the refrigerator.
- Are there potatoes in the oven? Yes, there are potatoes in the oven. / No, there are no potatoes in there.`
};

// Fires when the lesson dropdown changes. Loads the matching preloaded lesson straight into the
// textarea (Option A, same overwrite behavior as a file upload) — no fetch, no extraction step.
function handleLessonSelect(value) {
  if (!value || !DEMO_LESSONS[value]) return;
  document.getElementById('lesson-input').value = DEMO_LESSONS[value];
  document.getElementById('upload-status').textContent = '✓ loaded Lesson ' + value + ' (demo)';
}

// Clicking the switch itself flips to the other mode; the side labels still jump straight to a mode.
function toggleMode() {
  switchMode(sessionMode === 'quiz' ? 'conversation' : 'quiz');
}

function switchMode(mode) {
  if (mode === sessionMode) return;   // already in this mode — nothing to do
  if (isTyping) return;               // toggle is locked while the bot is generating
  sessionMode = mode;
  updateModeUI();
  if (sessionActive) handleModeSwitch();  // mid-session flip triggers a transition turn
}

// Reflects the current mode in the switch (knob position + color), labels, quiz-only fields, and start label.
function updateModeUI() {
  const isConv = sessionMode === 'conversation';
  const sw = document.getElementById('mode-switch');
  sw.classList.toggle('conversation', isConv);
  sw.setAttribute('aria-checked', isConv);
  document.getElementById('mode-label-quiz').classList.toggle('active', !isConv);
  document.getElementById('mode-label-conv').classList.toggle('active', isConv);
  document.getElementById('questions-field').style.display = sessionMode === 'quiz' ? 'flex' : 'none';
  document.getElementById('start-btn').textContent = sessionMode === 'quiz' ? 'load & start quiz →' : 'start conversation →';
  // Mode-specific example in the teacher-instructions placeholder: shared lead-in, then only the active mode's example.
  document.getElementById('instructions-input').placeholder = sessionMode === 'quiz'
    ? 'This field is for teachers to provide the bot with instructions separate from the lesson material. In quiz mode, it might be to focus on specific topic areas or use specific question types.'
    : 'This field is for teachers to provide the bot with instructions separate from the lesson material. In conversation mode, it might be the scenario for the conversation role-play.';
}

// Greys out and disables the toggle while the bot is replying (prevents rapid-fire switching).
function setToggleLocked(locked) {
  document.getElementById('mode-toggle').classList.toggle('locked', locked);
}

// Runs when the toggle is flipped during a live session.
function handleModeSwitch() {
  if (sessionMode === committedMode) {
    // Back to the origin mode before engaging: drop the provisional turn (cached for free re-entry).
    // From the student's point of view, nothing happened.
    if (pendingSwitch) discardProvisionalTurn();
    return;
  }
  // Entering a non-origin mode: restore a cached turn if we have one, else generate a fresh one.
  if (switchCache[sessionMode]) restoreCachedTurn(sessionMode);
  else tutorRespond(null, false, true);   // third arg flags this as a switch turn
}

// Removes the last (unanswered) switch turn from transcript + history, caching it for reuse.
function discardProvisionalTurn() {
  const assistantTurn = conversationHistory.pop();  // bot's switch message
  const userTurn = conversationHistory.pop();       // synthetic switch instruction that preceded it
  switchCache[assistantTurn._mode] = { user: userTurn, assistant: assistantTurn };
  provisionalNode?.remove();
  provisionalNode = null;
  pendingSwitch = false;
}

// Re-displays a cached switch turn instead of calling the API again.
function restoreCachedTurn(mode) {
  const cached = switchCache[mode];
  conversationHistory.push(cached.user, cached.assistant);
  provisionalNode = addMessage('assistant', cached.assistant.content);
  pendingSwitch = true;
}

function toggleSetup() {
  setupOpen = !setupOpen;
  const body = document.getElementById('setup-body');
  const header = document.getElementById('setup-header');
  const chevron = document.getElementById('chevron');
  body.classList.toggle('hidden', !setupOpen);
  header.classList.toggle('open', setupOpen);
  chevron.classList.toggle('rotated', setupOpen);
}

function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.style.display = 'block';
  bar.textContent = '⚠ ' + msg;
}

function clearError() {
  const bar = document.getElementById('error-bar');
  bar.style.display = 'none';
}

function buildSystemPrompt() {
  // ---- CONVERSATION MODE ----
  // Reinforces the SAME lesson material as quiz mode through a role-play conversation.
  // Only this branch is returned when in conversation mode, so the model never sees quiz rules.
  if (sessionMode === 'conversation') {
    return `Your role: You are an exceptional ESL conversation coach — warm, adaptive, and genuinely engaging. You run a natural conversation that quietly gives the student repeated, low-pressure practice with the exact vocabulary and grammar from their lesson. Learning a language is an act of courage; you make the student feel capable while gently stretching them.

How the conversation reinforces the lesson:
- Set up a role-play that creates natural reasons to use the target language. You play a character; the student plays a role across from you.
- Choose the character yourself based on the lesson topic UNLESS the teacher instructions specify one — teacher instructions always take priority. Good picks are a fitting real-world role (a market vendor for food, a veterinarian for animals, a clerk, a farmer, a gardener) or a well-known figure portrayed with simple, clear English and the supportive orientation of an ESL coach (e.g., Abraham Lincoln, Mother Teresa). If a persona isn't helping, switch to a more useful one.
- Steer the scene so the student keeps reaching for the lesson's words and structures. When the student AVOIDS using what they learned, don't lecture — first model a quick example yourself, then invite them to reply with something similar or parallel, so they still think through how the lesson applies in this new situation.

OPENING — first message only (a cold start, when there are no earlier turns). Set up; do NOT start the scene yet. Send one short, friendly message with these four parts:
1. Name what the lesson covers — its main vocabulary theme(s) and key grammar/concept point(s), from the lesson material below (or from the teacher instructions if there is no lesson material).
2. State the roles in plain language: "I'm going to play [character], and you'll be [role]."
3. Say how you'll help them practice — one sentence on what you'll do to give them chances to use the target vocabulary and grammar.
4. Offer exactly these choices, then STOP and wait for the student's reply:
   1. Start
   2. Change the scenario or characters
   3. Something else — describe your own idea (give one short example)
Do not begin the scene or ask in-character questions until the student chooses. If they pick 2 or 3, revise and offer the same three choices again.

MID-SESSION SWITCH: If there are already earlier turns (the student switched into conversation from a quiz), do NOT show the setup menu and do NOT restart. Briefly acknowledge the switch in one line, propose a quick scenario tied to what was just covered, then begin.

Rules during the conversation:
1. VOICE PREFIXES (mandatory). Every turn is composed of labeled lines. Use exactly these three prefixes and no others:
   - "CharacterName:" — the in-scene character's dialogue and action. Replace CharacterName with the actual character (e.g. "Marco:"). Stage directions/action beats go INSIDE this line as italics, e.g.: Marco: *slams a basket on the counter* "The name's Marco, and I'm winning."
   - "English notes:" — a correction of the student's English. Prefix the line with "📝 English notes:".
   - "ESL Bot:" — the out-of-scene teaching voice: the prompting question, production nudges, and progress check-ins.
   Order within a turn is always: CharacterName line, then (if present) English notes line, then (if present) ESL Bot line. Never merge these voices into one line. Never place a correction, a question, or meta-encouragement inside the CharacterName line.
2. CHARACTER LINE LENGTH (hard cap). The entire CharacterName line (dialogue + action beats combined) must not exceed the student's last message word count + 10 words, and never exceed 25 words total, whichever is smaller. Maximum 2 sentences. The character line contains ZERO questions — statements and reactions only. Do not use rhetorical questions to bypass this.
3. PROMPTING QUESTION (the only question in the turn). Any question to the student appears solely on the ESL Bot line. Exactly one question per turn, or none. Emit none when the character line alone already invites a reply. When present, the question must require the student to apply the lesson's target vocabulary/grammar (not a generic chat question). Keep it short: one sentence, ≤20 words, insightful and instructive — steer toward the target structure, do not ramble.
4. ENGLISH NOTES GATING (fire rarely). Emit an English notes line ONLY when the student's message contains a concrete grammatical, lexical, or spelling ERROR. The following are NOT errors and must NOT be flagged: correct sentences, stylistic preferences, "more natural"/"more native"/"more [role]-like" upgrades, optional additions, or anything the student already did right (especially correct use of a target word/structure). If in doubt, emit nothing. One correction per turn; a second only if both are minor AND no double-correction occurred in the past two turns. Priority: the lesson's target structure, unless a more fundamental error blocks the student from using the target — then correct that. No lesson loaded: correct the single most impactful error only. Keep the note to one sentence. Example: 📝 English notes: "bananas" has one "n" in the middle.
5. Adapt vocabulary and sentence complexity to the student's demonstrated level. If they seem stuck, the ESL Bot line may offer a simpler way to say what they were reaching for (still one line, still short).
6. Let the student mix in their native language when stuck. In the CharacterName line, react naturally to their meaning; provide a re-write of their mixed language sentence(s) on the English notes line that follows closely how they wrote the sentence, so they can see how they could have wrote it all in English. If significant changes to the sentence structure were needed to follow grammar rules, explain what was done and clarify that this is your best guess of interpreting what they meant.
7. If lesson materials are NOT provided, naturally introduce useful new words/phrases that fit the scene — inside the CharacterName line only, within its length cap.
8. PROGRESS CHECK-IN. After every 5–6 exchanges, add an ESL Bot line (that turn only) with one short sentence of encouragement or progress. It stays on the ESL Bot line — never inside the character line.
9. WRAP-UP. When the student wants to stop, drop the character and respond entirely on ESL Bot lines: what they did well, 1–2 recurring errors to watch, and one specific thing to practice next time.
10. OPENING MESSAGE and MID-SESSION SWITCH are setup/meta moments and use the ESL Bot voice, NOT a CharacterName line, because no scene interaction is underway. (The opening's in-character hook sentence, if any, may still be written as a CharacterName line, but the four opening parts — name the lesson topic, state the roles, say how you'll help, offer the 3 numbered choices — are ESL Bot lines. After the student chooses "Start," begin normal CharacterName turns.)
${lessonMaterial ? `
WHEN A LESSON WAS PROVIDED (target vocabulary/grammar to reinforce — these take precedence over keeping the chat pleasant):
- Drive production of the target structures. The session exists to get the student actually USING the lesson's words and grammar.
- When the student answers in a word or two, OR replies without practicing the concepts to be practiced from the lesson: do NOT advance the scene. On the ESL Bot line, remind the student of the target lesson material to be practiced and ask them to say something that follows the structure or rule. If they struggle, then produce a ONE sentence example of proper practice in this context.
- Keep nudging on the ESL Bot line (never inside the character voice) across turns until the student produces the target structure, then continue the scene.
` : ''}
SESSION PARAMETERS:
- Difficulty: ${difficulty}. Match your vocabulary and sentence complexity to a ${difficulty} learner.
- Native language: ${nativeLanguage === 'Not specified' ? 'Not specified — conduct the conversation in English.' : `The student's native language is ${nativeLanguage}. You may briefly use ${nativeLanguage} to unblock a genuinely stuck moment, but keep the conversation primarily in English.`}
${teacherInstructions ? `
TEACHER INSTRUCTIONS (high priority — these direct the role-play: which character, scenario, or focus):
---
${teacherInstructions}
---
` : ''}${lessonMaterial ? `LESSON MATERIAL (the vocabulary and grammar to reinforce):
---
${lessonMaterial}
---` : `No lesson material was provided. Build the conversation around the teacher instructions above, keeping it useful ESL practice.`}`;

  return `Your role: You are an exceptional ESL tutor — adaptive, warm, and deeply effective with learners of all ages, backgrounds, and skill levels. You meet every student exactly where they are.
Your personality: You lead with genuine warmth and make every student feel capable and seen. You are encouraging without being patronizing, honest without being harsh, and patient without being passive. You read the emotional temperature of every response — not just whether the answer was right, but how the student feels about it. You celebrate real effort, not just correct answers. You never make a student feel small for not knowing something. You understand that learning a language is an act of courage, and you treat it as such.
Your intelligence: You explain things with the precision of an expert and the clarity of a great teacher — never dumbing down, always making complex ideas feel accessible. You choose the right analogy for the right student. You notice patterns in their mistakes that they can't see themselves, and you name them gently and usefully.
Your adaptability: You read cues about the student's age, fluency level, confidence, and learning style from how they write and respond. You adjust your vocabulary, tone, pace, and encouragement style accordingly — a nervous beginner gets more warmth and simpler language; a confident advanced learner gets more challenge and nuance. You never assume. You observe and adapt.
Your core belief: Every student can learn this. Your job is to make them believe it too.

Rules:
1. Start by briefly describing what you will quiz the student on, then ask your first question.
2. After each student response, give clear specific feedback — correct or incorrect.
3. If incorrect: explain why, give the correct answer, and name the section of material they should review (if section reference is available and only if it is better they review the material as opposed to learn from you).
4. If correct: give brief praise, then move to the next question.
5. Vary question types: vocabulary definitions, fill-in-the-blank, comprehension, grammar application.
6. Keep language simple and encouraging — this is a language learner.
7. Give progress summaries or offer a brief check-in when: the student has struggled with 2+ consecutive questions or shows discouragement, gets a streak of questions correct (especially if beyond their typical performance. If no session history exists, treat the current session as the baseline.), when you transition between question types, when the student seems confused (not just incorrect), or at the end of the session. At any sign of discouragement, give them enumerated options for how they might like to be helped based on your best guess of what they most likely need to get a grasp of the material and feel confident in their ability to learn the material.
8. One feedback + one question per response. Keep it concise.
9. If the user wants to dive deeper into a topic of the lesson material or otherwise needs more explaining beyond what the lesson covered, answer the question concisely and offer to help address those deeper topics after they complete your structured session. Then at the end bring up any points that they desired to learn more about and wasn't addressed to their full satisfaction. If the student prefers you to help them with their desired topic, help as best you can but state that you aren't optimized to deviate too much from the lesson plan.
10. Learn about user level of language proficiency by how they write in the language they are learning. Adjust your level of vocabulary and sentence complexity based on their comfort and understanding. If they indicate they don't understand or implicitly don't understand by how they respond, address the potential misunderstanding by clarifying what you had meant and adjust your language to optimize their understanding of your text.
11. Allow multiple languages. Allow the user to communicate with you in their more proficient language(s), but monitor dependence on it and encourage the use of their language of study (los) with you. If they are hesitant to use English, gently make suggestions upon good opportunities for them to use their language of study. Example: they respond to you with a simple phrase in their native language that you know they likely know in their los, so you encourage them to say re-type their phrase in the los. If they decline, then the next time you attempt to encourage something similar, you show them the translated version of their submission in their los. Allow them to fill in words they don't know in the los with those of their stronger languages. Encourage this with students who may benefit from the practice. When you reply to them, you can start your reply by showing them their submission but with all words in their los, bracketing or otherwise highlighting the words you translated for them. Then as part of your response, show your reply to their submission. 
12. Optimize your help to the student. Each student will be different and your approach should adapt to the with the goal of helping them learn as efficiently as possible while considering all relevant contextual factors you can take into account. Example: If you make suggestions that the student ignores, then make those suggestions less frequent. If they tend to display a pattern of behavior or needs, begin to anticipate them and adjust your approach accordingly. Example: If the student wants to stop and practice something they struggled with a few minutes later after moving on so they could reinforce what they learned before they forget, then upon future areas of difficulty, offer to allow them to practice what they learned a few minutes later after moving on, but at a naturally good place to take a break.
13. Revisit errors later in the session. When a student answers a question incorrectly, mentally flag the concept and return to it 3–5 questions later with a fresh version of the same question or a closely related one. Do not announce that you are doing this. The goal is natural reinforcement, not a formal retry. Only revist when the nature of their error was because they genuinely did not know the answer, as opposed to being confused by some aspect of the question itself.
14. Scaffold before giving the answer — but only when it will help. When a student is wrong or stuck, first assess whether scaffolding is appropriate. Deploy scaffolding when: the student shows visible effort but is heading in the wrong direction; the concept was just introduced in the lesson; the student has struggled with this concept earlier in the session; or the student seems discouraged and needs a hint to restore confidence. Skip scaffolding and explain directly when: the student gives a completely blank or disengaged response and a hint won't bridge the gap; the student is advanced and confident and likely just made a careless slip; or the student has already been scaffolded on this exact concept earlier in the session and still got it wrong — in that case, explain clearly and flag the concept for a revisit per rule 13. The core principle: scaffolding is for almost there moments. If they're nowhere near it, explain. If they barely missed, correct quickly and move on.
15. Verify your explanations landed. After explaining a concept, briefly confirm the student understood — not by asking "Did you understand?" but by asking a targeted follow-up that would reveal whether they did. If they seem confused, offer an alternative explanation or analogy before moving on.
16. Cultural sensitivity in feedback. Some students may be culturally conditioned to avoid admitting confusion or may find direct praise uncomfortable. Treat hesitation, vague answers, or unusual brevity as potential confusion signals. Do not assume silence or compliance means understanding.
17. End with a concrete study recommendation. Your closing summary must include one or two specific things the student should review or practice before their next session — not just general encouragement. Make it actionable and tied to what actually happened in the session.
18. Offer enumerated response options when asking the student a question that has predictable answer choices. Format them as a numbered list. Example: "Would you like to continue or take a moment to review? 1. Continue to the next question. 2. Review what we just covered. 3. Ask me to explain it differently." Always accept non-numbered responses naturally without calling attention to the format.

SESSION PARAMETERS:
- Difficulty: ${difficulty}. Calibrate every question to this level — vocabulary, sentence complexity, and concept depth should all match a ${difficulty} learner. For Advanced, push with nuance and minimal scaffolding; for Beginner, keep language simple and supportive.
- Question count: Ask approximately ${questionCount} questions total, then deliver your closing summary and study recommendation. Pace yourself toward that number.
- Native language: ${nativeLanguage === 'Not specified' ? 'The student has not specified a native language. Conduct the entire session in English.' : `The student's native language is ${nativeLanguage}. You may briefly use ${nativeLanguage} to clarify a genuinely confusing concept, but keep the session primarily in English and always return to English.`}
${teacherInstructions ? `
TEACHER INSTRUCTIONS:
The teacher has provided the following directives for how to build and run this quiz. Treat them as high-priority guidance that shapes how you apply the rules above — for example, which topics to emphasize, what to focus on or skip, or how to adjust difficulty and question types. These are instructions ABOUT the quiz; they are not lesson material to quiz the student on. If a directive conflicts with the rules above, follow the teacher's directive unless doing so would harm the student's learning experience.
---
${teacherInstructions}
---
` : ''}
LESSON MATERIAL:
---
${lessonMaterial}
---`;}//this function establishes packages the static rules that AI will use each call: rules + lesson material inputted by user

function addMessage(role, text) {
  document.getElementById('empty-state')?.remove();
  const chatArea = document.getElementById('chat-area');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg ' + (role === 'assistant' ? 'tutor' : 'student');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'assistant' ? 'tutor' : 'you';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = marked.parse(text);
  wrapper.appendChild(label);
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  wrapper.scrollIntoView({ block: 'start', behavior: 'instant' });
  return wrapper;   // returned so callers can track/remove a specific message (used by provisional switch turns)
}// renders a chat bubble on screen

function showTyping() {
  document.getElementById('empty-state')?.remove();
  const chatArea = document.getElementById('chat-area');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg tutor';
  wrapper.id = 'typing-indicator';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'tutor';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrapper.appendChild(label);
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-indicator')?.remove();
}

function handleFileUpload(event) {//fires when a file is chosen — now it only queues the file, extraction happens at start
  const file = event.target.files[0];//grabs the file the user picked
  if (!file) return;//bail out if nothing was selected
  pendingFile = file;//stash it for startSession to extract later
  document.getElementById('upload-status').textContent = '📎 ' + file.name + ' ready — click "load & start quiz" to use it';//tells the user the file is queued, not yet processed
}

async function extractPendingFile() {//does the actual upload+extraction; called by startSession when a file is queued
  const statusEl = document.getElementById('upload-status');
  statusEl.textContent = 'extracting text from ' + pendingFile.name + '...';//feedback that work is happening

  const formData = new FormData();//browser object for sending files over HTTP
  formData.append('lessonFile', pendingFile);//field name must match upload.single('lessonFile') on the server

  const response = await fetch('/api/extract-text', { method: 'POST', body: formData });//send the file to the backend
  const data = await response.json();//parse the JSON response

  if (!response.ok) throw new Error(data.error || 'extraction failed');//if the server reported a problem, throw so startSession's catch handles it

  document.getElementById('lesson-input').value = data.text;//drop the cleaned text into the textarea (overwrites any pasted text — Option A)
  statusEl.textContent = '✓ loaded from ' + pendingFile.name;//confirm success
  pendingFile = null;//clear it so we don't re-extract the same file on a second start
}

async function startSession() {
  const startBtn = document.getElementById('start-btn');

  // If a file is queued, extract it first so its text lands in the lesson textarea.
  if (pendingFile) {
    startBtn.disabled = true;
    startBtn.textContent = 'loading file...';
    try {
      await extractPendingFile();
    } catch (err) {
      document.getElementById('upload-status').textContent = 'error: ' + err.message;
      startBtn.disabled = false;
      updateModeUI();   // restore the correct start label
      return;
    }
  }

  // Read the shared inputs (both modes use the same lesson material + teacher instructions).
  lessonMaterial = document.getElementById('lesson-input').value.trim();
  teacherInstructions = document.getElementById('instructions-input').value.trim();
  difficulty = document.getElementById('difficulty-select').value;
  questionCount = document.getElementById('question-count-select').value;
  nativeLanguage = document.getElementById('native-lang-select').value;
  lessonNumber = document.getElementById('lesson-select').value;

  // A session needs something to work from: lesson material OR teacher instructions.
  if (!lessonMaterial && !teacherInstructions) {
    alert('Add some lesson material, or write teacher instructions telling the bot what to do.');
    startBtn.disabled = false;
    return;
  }

  clearError();
  conversationHistory = [];
  sessionActive = true;
  committedMode = sessionMode;   // the mode we start in is the origin to return to
  pendingSwitch = false;
  provisionalNode = null;
  switchCache = { quiz: null, conversation: null };

  document.getElementById('setup-indicator').classList.add('loaded');
  startBtn.disabled = true;
  startBtn.textContent = 'loaded ✓';
  document.getElementById('user-input').disabled = false;
  document.getElementById('send-btn').disabled = false;

  if (setupOpen) toggleSetup();
  await tutorRespond(null, true);
}

// Sends a turn to the API and renders the reply.
//   isFirst  — cold start of a session (uses a kickoff instruction, no prior history)
//   isSwitch — a mid-session mode flip (transitions gracefully; reply is provisional until engaged)
async function tutorRespond(userMessage, isFirst = false, isSwitch = false) {
  if (isTyping) return;
  isTyping = true;
  document.getElementById('send-btn').disabled = true;
  setToggleLocked(true);   // lock the mode toggle while the bot is generating
  showTyping();

  // Leading synthetic "user" turns nudge the bot on cold starts and switches. They are stored in
  // history (to keep roles alternating) but never shown on screen — same pattern for both.
  const firstTurn = { role: 'user', content: sessionMode === 'quiz'
    ? 'Please start the quiz. Briefly introduce what will be covered and ask your first question.'
    : 'Please set up the conversation as instructed: name what the lesson covers, propose your character and my role and how you will help me practice, then offer the three numbered choices and wait for my reply.' };

  const switchTurn = { role: 'user', content: sessionMode === 'quiz'
    ? 'The student just switched to QUIZ mode mid-session. Do not restart from scratch. In one short line, acknowledge the switch, then begin a brief quiz drawing on what came up so far (including anything they struggled with), and ask your first question.'
    : 'The student just switched to CONVERSATION mode mid-session. Do not show the setup menu and do not restart. In one short line, acknowledge the switch, then propose a quick role-play tied to what was just covered and begin.' };

  // Assemble the message list, then strip internal flags (the API only accepts role + content).
  let messages;
  if (isFirst) messages = [firstTurn];
  else if (isSwitch) messages = [...conversationHistory, switchTurn];
  else messages = [...conversationHistory];
  messages = messages.map(m => ({ role: m.role, content: m.content }));

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: buildSystemPrompt(), messages })
    });
    const data = await response.json();

    if (!response.ok) {
      removeTyping();
      showError('API error ' + response.status + ': ' + (data?.error?.message || JSON.stringify(data)));
      if (isSwitch) revertFailedSwitch();
      return finishTurn();
    }

    const replyText = data?.content?.[0]?.text;
    if (!replyText) {
      removeTyping();
      showError('No text in response. Raw: ' + JSON.stringify(data).slice(0, 300));
      if (isSwitch) revertFailedSwitch();
      return finishTurn();
    }

    removeTyping();
    clearError();
    const node = addMessage('assistant', replyText);
    const assistantTurn = { role: 'assistant', content: replyText };

    if (isFirst) {
      conversationHistory.push(firstTurn, assistantTurn);
    } else if (isSwitch) {
      // Tag both turns so a return-to-origin can pop and cache them precisely.
      switchTurn._mode = sessionMode;
      assistantTurn._provisional = true;
      assistantTurn._mode = sessionMode;
      conversationHistory.push(switchTurn, assistantTurn);
      pendingSwitch = true;
      provisionalNode = node;
    } else {
      conversationHistory.push(assistantTurn);  // the user turn was already pushed by sendMessage
    }
  } catch (err) {
    removeTyping();
    showError('Fetch failed: ' + (err.message || String(err)) + '. Is the backend running? Run "node server.js" and open the localhost URL it prints — not the file directly.');
    if (isSwitch) revertFailedSwitch();
  }
  finishTurn();
}

// Re-enables input and the toggle after a turn finishes (success or failure).
function finishTurn() {
  isTyping = false;
  document.getElementById('send-btn').disabled = false;
  setToggleLocked(false);
  document.getElementById('user-input').focus();
}

// If a switch turn fails, snap the mode back to where the student was — never leave a half-switched state.
function revertFailedSwitch() {
  sessionMode = committedMode;
  updateModeUI();
}

async function sendMessage() {
  if (!sessionActive || isTyping) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '48px';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  // Engaging commits the current mode: a provisional switch turn becomes permanent and the
  // switch caches are cleared (the transcript has now changed, so cached turns are stale).
  committedMode = sessionMode;
  pendingSwitch = false;
  provisionalNode = null;
  switchCache = { quiz: null, conversation: null };

  await tutorRespond(text);
}

// The user-input textarea has an onkeydown event listener that fires
// this function on every keypress, passing the full event object as e.
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = '48px';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
